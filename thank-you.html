<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <script src="js/theme.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Thank You — Navigo Nepal</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg-primary);
      margin: 0;
      padding: 1.5rem;
      font-family: 'Inter', sans-serif;
      color: var(--text-main);
      overflow-x: hidden;
    }

    .thank-you-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 3.5rem 2.5rem;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: var(--shadow-xl);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.75rem;
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Animated Checkmark CSS */
    .success-checkmark {
      width: 80px;
      height: 80px;
      margin: 0 auto;
    }

    .check-icon {
      width: 80px;
      height: 80px;
      position: relative;
      border-radius: 50%;
      box-sizing: content-box;
      border: 4px solid var(--accent-emerald);
    }

    .check-icon::before {
      top: 3px;
      left: -2px;
      width: 30px;
      transform-origin: 100% 50%;
      border-radius: 100px 0 0 100px;
    }

    .check-icon::after {
      top: 0;
      left: 30px;
      width: 60px;
      transform-origin: 0 50%;
      border-radius: 0 100px 100px 0;
      animation: rotate-circle 4.25s ease-in;
    }

    .check-icon::before,
    .check-icon::after {
      content: '';
      height: 100px;
      position: absolute;
      background: var(--bg-secondary);
      transform: rotate(-45deg);
    }

    .icon-line {
      height: 5px;
      background-color: var(--accent-emerald);
      display: block;
      border-radius: 2px;
      position: absolute;
      z-index: 10;
    }

    .icon-line.line-tip {
      top: 46px;
      left: 14px;
      width: 25px;
      transform: rotate(45deg);
      animation: icon-line-tip 0.75s;
    }

    .icon-line.line-long {
      top: 38px;
      right: 8px;
      width: 47px;
      transform: rotate(-45deg);
      animation: icon-line-long 0.75s;
    }

    .icon-circle {
      top: -4px;
      left: -4px;
      box-sizing: content-box;
      border: 4px solid rgba(16, 185, 129, 0.2);
      border-radius: 50%;
      width: 80px;
      height: 80px;
      position: absolute;
      z-index: 1;
    }

    .icon-fix {
      top: 8px;
      left: 28px;
      width: 5px;
      height: 85px;
      background-color: var(--bg-secondary);
      position: absolute;
      z-index: 1;
      transform: rotate(-45deg);
    }

    @keyframes icon-line-tip {
      0% {
        width: 0;
        left: 1px;
        top: 19px;
      }

      54% {
        width: 0;
        left: 1px;
        top: 19px;
      }

      70% {
        width: 50px;
        left: -8px;
        top: 37px;
      }

      84% {
        width: 17px;
        left: 21px;
        top: 48px;
      }

      100% {
        width: 25px;
        left: 14px;
        top: 46px;
      }
    }

    @keyframes icon-line-long {
      0% {
        width: 0;
        right: 46px;
        top: 54px;
      }

      65% {
        width: 0;
        right: 46px;
        top: 54px;
      }

      84% {
        width: 55px;
        right: 0px;
        top: 35px;
      }

      100% {
        width: 47px;
        right: 8px;
        top: 38px;
      }
    }

    .thank-you-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(1.75rem, 6vw, 2.5rem);
      font-weight: 800;
      margin: 0;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    .thank-you-desc {
      font-size: clamp(0.95rem, 3vw, 1.1rem);
      line-height: 1.7;
      color: var(--text-muted);
      margin: 0;
    }

    .countdown-text {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 1.5rem;
    }

    .countdown-number {
      font-weight: 700;
      color: var(--accent-color);
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.88rem 2.25rem;
      background: var(--gradient-primary);
      color: var(--pure-white) !important;
      border-radius: var(--radius-full);
      font-weight: 600;
      text-decoration: none;
      box-shadow: var(--shadow-md);
      transition: all 0.3s ease;
      font-size: 0.95rem;
      margin-top: 1rem;
      border: none;
      cursor: pointer;
      min-height: 48px;
    }

    .btn-home:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
      opacity: 0.95;
    }

    @media (max-width: 480px) {
      body {
        padding: max(1rem, env(safe-area-inset-top, 0px)) max(0.75rem, env(safe-area-inset-right, 0px)) max(1rem, env(safe-area-inset-bottom, 0px)) max(0.75rem, env(safe-area-inset-left, 0px));
      }

      .thank-you-card {
        padding: 2.5rem 1.25rem;
      }

      .btn-home {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="thank-you-card">
    <div class="success-checkmark">
      <div class="check-icon">
        <span class="icon-line line-tip"></span>
        <span class="icon-line line-long"></span>
        <div class="icon-circle"></div>
        <div class="icon-fix"></div>
      </div>
    </div>
    <h1 class="thank-you-title">Thank You!</h1>
    <p class="thank-you-desc">
      Your submission has been successfully received. We appreciate you taking the time to connect with Navigo Nepal.
    </p>
    <a href="index.html" class="btn-home">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Return Home
    </a>
    <p class="countdown-text">
      Redirecting to homepage in <span id="countdown" class="countdown-number">8</span> seconds...
    </p>
  </div>

  <script>
    let secondsLeft = 8;
    const countdownEl = document.getElementById("countdown");
    const interval = setInterval(() => {
      secondsLeft--;
      if (countdownEl) {
        countdownEl.textContent = secondsLeft;
      }
      if (secondsLeft <= 0) {
        clearInterval(interval);
        window.location.href = "index.html";
      }
    }, 1000);
  </script>
</body>

</html>
