<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Navigo Nepal — Official Email Templates Studio</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="shortcut icon" href="favicon.ico">
  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --navy-dark: #06172F;
      --navy-primary: #0A2342;
      --navy-light: #0d2a4a;
      --blue-accent: #2563EB;
      --blue-light: #4F9CF9;
      --emerald: #10B981;
      --amber: #F4A261;
      --red: #E63946;
      --bg-page: #F8FBFF;
      --card-bg: #FFFFFF;
      --text-main: #0A2342;
      --text-muted: #64748B;
      --border-color: rgba(10, 35, 66, 0.1);
      --radius: 12px;
      --shadow: 0 10px 30px rgba(10, 35, 66, 0.08);
    }

    [data-theme="dark"] {
      --bg-page: #06172F;
      --card-bg: #0A2342;
      --text-main: #F0F6FF;
      --text-muted: #8BA3C4;
      --border-color: rgba(255, 255, 255, 0.1);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Top Navigation Header */
    header.studio-header {
      background: var(--navy-primary);
      color: #FFFFFF;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #FFFFFF;
    }

    .brand-logo img {
      height: 40px;
      width: auto;
      border-radius: 6px;
      background: #ffffff;
      padding: 4px;
    }

    .brand-logo-text {
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: -0.5px;
    }

    .brand-logo-text span {
      color: var(--blue-light);
    }

    .brand-badge {
      background: rgba(37, 99, 235, 0.2);
      border: 1px solid rgba(79, 156, 249, 0.4);
      color: var(--blue-light);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn-theme-toggle {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #FFFFFF;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.875rem;
      transition: all 0.2s ease;
    }

    .btn-theme-toggle:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Main Content Layout */
    .studio-container {
      display: grid;
      grid-template-columns: 340px 1fr;
      flex: 1;
      height: calc(100vh - 72px);
      overflow: hidden;
    }

    /* Sidebar Selector & Variables */
    .sidebar {
      background: var(--card-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 24px;
      gap: 24px;
    }

    .section-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .template-selector {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .template-item {
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: transparent;
      color: var(--text-main);
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .template-item i {
      font-size: 1.1rem;
      color: var(--blue-accent);
      width: 20px;
      text-align: center;
    }

    .template-item:hover {
      border-color: var(--blue-accent);
      background: rgba(37, 99, 235, 0.04);
    }

    .template-item.active {
      background: var(--blue-accent);
      color: #FFFFFF;
      border-color: var(--blue-accent);
      font-weight: 600;
    }

    .template-item.active i {
      color: #FFFFFF;
    }

    .template-item-info {
      display: flex;
      flex-direction: column;
    }

    .template-item-name {
      font-size: 0.9rem;
    }

    .template-item-desc {
      font-size: 0.75rem;
      opacity: 0.8;
      margin-top: 2px;
    }

    /* Variable Customizer */
    .variable-fields {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .form-group input, .form-group textarea, .form-group select {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-page);
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.875rem;
      transition: border-color 0.2s;
    }

    .form-group input:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--blue-accent);
    }

    /* Workspace & Live Preview */
    .workspace {
      display: flex;
      flex-direction: column;
      background: var(--bg-page);
      overflow: hidden;
    }

    .toolbar {
      padding: 16px 24px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .view-mode-tabs {
      display: flex;
      background: var(--bg-page);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .tab-btn {
      padding: 6px 16px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: inherit;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: var(--text-main);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .device-toggles {
      display: flex;
      gap: 6px;
    }

    .device-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .device-btn.active {
      background: var(--blue-accent);
      color: #FFFFFF;
      border-color: var(--blue-accent);
    }

    .action-buttons {
      display: flex;
      gap: 10px;
    }

    .btn-action {
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      border: none;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--blue-accent);
      color: #FFFFFF;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .btn-secondary {
      background: rgba(16, 185, 129, 0.1);
      color: var(--emerald);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .btn-secondary:hover {
      background: rgba(16, 185, 129, 0.2);
    }

    /* Preview Canvas */
    .preview-container {
      flex: 1;
      padding: 32px;
      overflow-y: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .email-frame {
      width: 100%;
      max-width: 650px;
      background: #FFFFFF;
      border-radius: 12px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      overflow: hidden;
      transition: max-width 0.3s ease;
    }

    .email-frame.mobile {
      max-width: 375px;
    }

    iframe#previewIframe {
      width: 100%;
      height: 750px;
      border: none;
      display: block;
      background: #FFFFFF;
    }

    /* Code View Panel */
    .code-container {
      flex: 1;
      padding: 24px;
      display: none;
      overflow-y: auto;
    }

    .code-editor {
      width: 100%;
      height: 100%;
      background: #06172F;
      color: #7dd3fc;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      white-space: pre-wrap;
      overflow-y: auto;
      resize: none;
    }

    /* Toast Notifications */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #0A2342;
      color: #FFFFFF;
      padding: 12px 20px;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      border-left: 4px solid var(--emerald);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 1000;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="studio-header">
    <a href="index.html" class="brand-logo">
      <img src="assets/navigo-logo.png" alt="Navigo Nepal Logo" onerror="this.src='favicon.ico'">

  </header>

  <!-- Studio Main Content -->

      <div>

          <button class="template-item active" data-template="welcome">

            </div>

              <span class="template-item-name">Workshop / Event Invitation</span>
              <span class="template-item-desc">For STEM sessions, SEE guidance & summits</span>
            </div>
          </button>
          <button class="template-item" data-template="certificate">
            <i class="fa-solid fa-award"></i>
            <div class="template-item-info">

              <span class="template-item-desc">Official certificate delivery & badge release</span>
            </div>
          </button>
          <button class="template-item" data-template="donation">

          <button class="template-item" data-template="newsletter">

          </button>
        </div>
      </div>

      <div>
        <div class="section-title">Customize Variables</div>
        <div class="variable-fields" id="variableFields">
          <!-- Dynamic inputs generated via JavaScript -->
        </div>
      </div>
    </aside>

    <!-- Workspace & Live Canvas -->
    <main class="workspace">
      <!-- Toolbar -->
      <div class="toolbar">
        <div class="view-mode-tabs">
          <button class="tab-btn active" id="tabVisual">
            <i class="fa-solid fa-eye"></i> Visual Preview
          </button>
          <button class="tab-btn" id="tabHTML">
            <i class="fa-solid fa-code"></i> HTML Source
          </button>
          <button class="tab-btn" id="tabText">
            <i class="fa-solid fa-align-left"></i> Plain Text
          </button>
        </div>

        <div class="device-toggles" id="deviceToggles">
          <button class="device-btn active" id="devDesktop" title="Desktop View (650px)">
            <i class="fa-solid fa-desktop"></i>
          </button>
          <button class="device-btn" id="devMobile" title="Mobile View (375px)">
            <i class="fa-solid fa-mobile-screen"></i>
          </button>
        </div>

        <div class="action-buttons">
          <button class="btn-action btn-secondary" id="btnCopyText">
            <i class="fa-solid fa-copy"></i> Copy Text
          </button>
          <button class="btn-action btn-primary" id="btnCopyHTML">
            <i class="fa-solid fa-code"></i> Copy HTML Code
          </button>
        </div>
      </div>

      <!-- Preview Canvas Area -->
      <div class="preview-container" id="previewContainer">
        <div class="email-frame" id="emailFrame">
          <iframe id="previewIframe" title="Email Live Preview"></iframe>
        </div>
      </div>

      <!-- Code Source Container -->
      <div class="code-container" id="codeContainer">
        <textarea class="code-editor" id="codeTextarea" readonly></textarea>
      </div>
    </main>

  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <i class="fa-solid fa-circle-check"></i>
    <span id="toastMsg">Template HTML copied to clipboard!</span>
  </div>

    // State Management
    let currentTemplateKey = "welcome";
    let activeTab = "visual"; // visual, html, text
    let activeDevice = "desktop"; // desktop, mobile

    // DOM Elements
    const templateButtons = document.querySelectorAll(".template-item");
    const variableFieldsContainer = document.getElementById("variableFields");
    const previewIframe = document.getElementById("previewIframe");
    const emailFrame = document.getElementById("emailFrame");
    const codeTextarea = document.getElementById("codeTextarea");
    const previewContainer = document.getElementById("previewContainer");
    const codeContainer = document.getElementById("codeContainer");
    
    const tabVisual = document.getElementById("tabVisual");
    const tabHTML = document.getElementById("tabHTML");
    const tabText = document.getElementById("tabText");
    
    const devDesktop = document.getElementById("devDesktop");
    const devMobile = document.getElementById("devMobile");
    const deviceToggles = document.getElementById("deviceToggles");

    const btnCopyHTML = document.getElementById("btnCopyHTML");
    const btnCopyText = document.getElementById("btnCopyText");
    const themeToggleBtn = document.getElementById("themeToggleBtn");
    const toast = document.getElementById("toast");
    const toastMsg = document.getElementById("toastMsg");

    // Render Variable Fields
    function renderVariableInputs() {
      const template = TEMPLATES[currentTemplateKey];
      variableFieldsContainer.innerHTML = "";

      Object.keys(template.variables).forEach(key => {
        const div = document.createElement("div");
        div.className = "form-group";

        const label = document.createElement("label");
        label.textContent = key.replace(/_/g, " ");

        const input = document.createElement("input");
        input.type = "text";
        input.value = template.variables[key];
        input.dataset.varKey = key;

        input.addEventListener("input", (e) => {
          template.variables[key] = e.target.value;
          updateRender();
        });

        div.appendChild(label);
        div.appendChild(input);
        variableFieldsContainer.appendChild(div);
      });
    }

    // Update Output Canvas
    function updateRender() {
      const template = TEMPLATES[currentTemplateKey];
      const htmlCode = template.html(template.variables);
      const textCode = template.text(template.variables);

      // Render iFrame
      const iframeDoc = previewIframe.contentDocument || previewIframe.contentWindow.document;
      iframeDoc.open();
      iframeDoc.write(htmlCode);
      iframeDoc.close();

      // Render Code Panel
      if (activeTab === "html") {
        codeTextarea.value = htmlCode;
      } else if (activeTab === "text") {
        codeTextarea.value = textCode;
      }
    }

    // Switch Active Template
    templateButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        templateButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentTemplateKey = btn.dataset.template;
        renderVariableInputs();
        updateRender();
      });
    });

    // Tab Switchers
    tabVisual.addEventListener("click", () => {
      activeTab = "visual";
      tabVisual.classList.add("active");
      tabHTML.classList.remove("active");
      tabText.classList.remove("active");
      
      previewContainer.style.display = "flex";
      codeContainer.style.display = "none";
      deviceToggles.style.display = "flex";
    });

    tabHTML.addEventListener("click", () => {
      activeTab = "html";
      tabHTML.classList.add("active");
      tabVisual.classList.remove("active");
      tabText.classList.remove("active");

      previewContainer.style.display = "none";
      codeContainer.style.display = "block";
      deviceToggles.style.display = "none";
      updateRender();
    });

    tabText.addEventListener("click", () => {
      activeTab = "text";
      tabText.classList.add("active");
      tabVisual.classList.remove("active");
      tabHTML.classList.remove("active");

      previewContainer.style.display = "none";
      codeContainer.style.display = "block";
      deviceToggles.style.display = "none";
      updateRender();

    devMobile.addEventListener("click", () => {
      devMobile.classList.add("active");
      devDesktop.classList.remove("active");
      emailFrame.classList.add("mobile");
    });

    // Copy to Clipboard
    function showToast(msg) {
      toastMsg.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 3000);
    }

    btnCopyHTML.addEventListener("click", () => {
      const template = TEMPLATES[currentTemplateKey];
      const htmlCode = template.html(template.variables);
      navigator.clipboard.writeText(htmlCode).then(() => {
        showToast("HTML code copied to clipboard!");
      });
    });

    btnCopyText.addEventListener("click", () => {
      const template = TEMPLATES[currentTemplateKey];
      const textCode = template.text(template.variables);
      navigator.clipboard.writeText(textCode).then(() => {
        showToast("Plain text copied to clipboard!");
      });
    });

    // Theme Switcher
    themeToggleBtn.addEventListener("click", () => {
      const isDark = document.body.getAttribute("data-theme") === "dark";
      if (isDark) {
        document.body.removeAttribute("data-theme");
        themeToggleBtn.innerHTML = '<i class="fa-solid fa-moon"></i> <span>Dark Mode</span>';
      } else {
        document.body.setAttribute("data-theme", "dark");
        themeToggleBtn.innerHTML = '<i class="fa-solid fa-sun"></i> <span>Light Mode</span>';
      }
    });

    // Initial Execution
    renderVariableInputs();
    setTimeout(updateRender, 100);
  </script>
</body>
</html>
